<svg id="sterolnr" viewBox="0 0 1000 596" style="min-width:760px" role="img" aria-label="Sterol and LXR evidence. Band 1: DHCR24 is higher in APOE4 in five independent datasets. Band 2: the consequence is now measured rather than inferred — isogenic APOE4 astrocytes hold 20 percent more total cholesterol, entirely as free cholesterol with cholesteryl ester unchanged, and three times more lysosomal cholesterol, so the endoplasmic reticulum reads sterol-depleted while the lysosome is loaded, which predicts weaker LXR agonism. Band 3: the hypothesis tested pharmacologically — LXR agonists restore APOE4 cholesterol efflux to APOE3 levels whereas 25-hydroxycholesterol does not. Band 4: the disposal route differs by cell type, astrocytes storing free cholesterol and oligodendroglia esterifying it. Band 5: the opposing 24S-hydroxycholesterol arm is withdrawn because CYP46A1 is down in human oligodendroglia."><defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--ink2)"/></marker></defs><text x="0" y="14" font-size="11" text-anchor="start" class="mono muted" font-weight="600">THE REPLICATED OBSERVATION — DHCR24 higher in APOE4, five datasets, three platforms, two species</text><rect x="0" y="24" width="1000" height="146" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><text x="12" y="42" font-size="9.5" text-anchor="start" class="mono muted">dataset</text><text x="470" y="42" font-size="9.5" text-anchor="end" class="mono muted">log₂FC</text><text x="486" y="42" font-size="9.5" text-anchor="start" class="mono muted">significance</text><text x="660" y="42" font-size="9.5" text-anchor="start" class="mono muted">what it controls for</text><text x="12" y="64" font-size="10.5" text-anchor="start" class="mono">our LC Visium · 5-domain pool</text><rect x="300" y="55" width="58.0" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="64" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.276</text><text x="486" y="64" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">FDR 5.7×10⁻⁷</text><text x="660" y="64" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">spot-level, E4 vs E2 carriers</text><text x="12" y="83" font-size="10.5" text-anchor="start" class="mono" fill="var(--ink2)">our ERC snRNA · oligodendrocytes</text><rect x="300" y="74" width="42.2" height="10" rx="1.5" fill="var(--c-up)"/><rect x="300" y="74" width="42.2" height="10" rx="1.5" fill="var(--surf)" opacity="0.45"/><text x="470" y="83" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.201</text><text x="486" y="83" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">n.s. (underpowered)</text><text x="660" y="83" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">cell-type resolved, same direction</text><text x="12" y="102" font-size="10.5" text-anchor="start" class="mono">isogenic iPSC oligodendroglia</text><rect x="300" y="93" width="128.9" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="102" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.614</text><text x="486" y="102" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">q 1.7×10⁻⁴</text><text x="660" y="102" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">genotype is the ONLY variable</text><text x="12" y="121" font-size="10.5" text-anchor="start" class="mono">post-mortem oligodendrocytes · Nebula</text><rect x="300" y="112" width="115.7" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="121" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.551</text><text x="486" y="121" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">padj 0.024</text><text x="660" y="121" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">human tissue, per-nucleus</text><text x="12" y="140" font-size="10.5" text-anchor="start" class="mono">post-mortem oligodendrocytes · Wilcoxon</text><rect x="300" y="131" width="24.8" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="140" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.118</text><text x="486" y="140" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">top-ranked, up in AD + non-AD</text><text x="660" y="140" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">~10⁵ nuclei, both strata</text><text x="12" y="164" font-size="9.5" text-anchor="start" class="mono muted">DHCR24 = 24-dehydrocholesterol reductase: converts desmosterol → cholesterol. Also seladin-1, reduced in vulnerable neurons in AD.</text><text x="0" y="194" font-size="11" text-anchor="start" class="mono muted" font-weight="600">NOW MEASURED, NOT INFERRED — APOE4 glia hoard FREE cholesterol in lysosomes while the ER reads "depleted"</text><rect x="0" y="204" width="1000" height="124" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><rect x="10" y="214" width="274" height="104" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="22" y="232" font-size="10" text-anchor="start" class="mono" font-weight="600">isogenic APOE4 vs APOE3 astrocytes</text><text x="22" y="245" font-size="9" text-anchor="start" class="mono muted">GC-MS · n = 6, 4 experiments</text><text x="22" y="266" font-size="10.5" text-anchor="start" class="mono">total cholesterol</text><text x="274" y="266" font-size="11" text-anchor="end" class="mono" font-weight="600" fill="var(--c-up)">+20%</text><text x="22" y="283" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">…entirely FREE cholesterol</text><text x="22" y="300" font-size="10.5" text-anchor="start" class="mono">cholesteryl ester</text><text x="274" y="300" font-size="10.5" text-anchor="end" class="mono" fill="var(--ink2)">unchanged</text><text x="22" y="313" font-size="9.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-up)">lysosomal cholesterol 3× (p&lt;0.001, filipin)</text><circle cx="318" cy="252" r="8" fill="var(--chol)"/><text x="318" y="274" font-size="9.5" text-anchor="middle" class="mono" font-weight="600">desmosterol</text><path d="M 334 252 L 372 252" stroke="var(--ink2)" stroke-width="1.8" fill="none" marker-end="url(#ah4)"/><text x="353" y="245" font-size="9" text-anchor="middle" class="mono" fill="var(--c-up)">DHCR24 ↑</text><circle cx="396" cy="252" r="8" fill="none" stroke="var(--c-dn)" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><circle cx="396" cy="252" r="3" fill="var(--chol)" opacity="0.3"/><text x="396" y="274" font-size="9.5" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">↓ predicted</text><path d="M 414 252 L 452 252" stroke="var(--c-dn)" stroke-width="2.2" fill="none"/><path d="M 452 242 L 452 262" stroke="var(--c-dn)" stroke-width="3"/><text x="433" y="243" font-size="9" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">LESS</text><rect x="462" y="224" width="132" height="60" rx="6" fill="var(--neutral)" stroke="var(--ink)" stroke-width="1.6"/><text x="528" y="248" font-size="14" text-anchor="middle" font-weight="600">LXR / RXR</text><text x="528" y="266" font-size="9.5" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">hypo-agonised</text><text x="528" y="300" font-size="9.5" text-anchor="middle" class="mono" fill="var(--ink2)">efflux ↓ · our PLTP −0.505</text><text x="528" y="313" font-size="9" text-anchor="middle" class="mono" fill="var(--ink2)">ABCA1, ABCA7, APOE protein ↓ (TCW)</text><rect x="606" y="214" width="384" height="104" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="618" y="232" font-size="9.5" text-anchor="start" class="mono muted" font-weight="600">the authors' own mechanism</text><text x="618" y="252" font-size="10.5" text-anchor="start" fill="var(--ink)">"lysosomal sequestration of free cholesterol away</text><text x="618" y="267" font-size="10.5" text-anchor="start" fill="var(--ink)">from ER that misinforms APOE4 cells to respond</text><text x="618" y="282" font-size="10.5" text-anchor="start" fill="var(--ink)">as if intracellular cholesterol levels are low,</text><text x="618" y="297" font-size="10.5" text-anchor="start" fill="var(--ink)">leading to upregulated de novo synthesis"</text><text x="618" y="313" font-size="9" text-anchor="start" class="mono muted">TCW et al. 2022 · independently reached from the sterol side</text><text x="0" y="350" font-size="11" text-anchor="start" class="mono muted" font-weight="600">THE HYPOTHESIS TESTED PHARMACOLOGICALLY</text><rect x="0" y="360" width="490" height="112" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><path d="M 14 382 l 3.5 4 l 6 -9" stroke="var(--c-up)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="386" font-size="10.5" text-anchor="start" class="mono" font-weight="600">LXR agonists GW3965 · T0901317</text><text x="34" y="400" font-size="10" text-anchor="start" class="mono" fill="var(--c-up)">restore APOE4 efflux to untreated APOE3 level</text><path d="M 14 412 l 8 8 M 22 412 l -8 8" stroke="var(--ink2)" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="34" y="420" font-size="10.5" text-anchor="start" class="mono" font-weight="600">25-hydroxycholesterol</text><text x="34" y="434" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">no rescue of efflux (it suppresses SREBF2 instead)</text><text x="14" y="450" font-size="9" text-anchor="start" class="mono muted">Incomplete: the APOE4-vs-APOE3 baseline gap persists under treatment; in microglia the</text><text x="14" y="462" font-size="9" text-anchor="start" class="mono muted">agonists raise APOE in APOE3 but NOT in APOE4 — the response is cell-type specific.</text><text x="510" y="350" font-size="11" text-anchor="start" class="mono muted" font-weight="600">THE DISPOSAL ROUTE DIFFERS BY CELL TYPE</text><rect x="510" y="360" width="490" height="112" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="522" y="380" font-size="11" text-anchor="start" class="mono" font-weight="600">astrocytes</text><text x="988" y="380" font-size="10.5" text-anchor="end" class="mono" fill="var(--c-up)">store it FREE · CE unchanged</text><text x="522" y="402" font-size="11" text-anchor="start" class="mono" font-weight="600">oligodendroglia</text><text x="988" y="402" font-size="10.5" text-anchor="end" class="mono" fill="var(--c-up)">esterify it · 35/35 CE ↑ ≈9×</text><text x="522" y="424" font-size="11" text-anchor="start" class="mono" font-weight="600">both compartments</text><text x="988" y="424" font-size="10.5" text-anchor="end" class="mono" fill="var(--c-up)">BMP ↑ in 3 cohorts</text><text x="522" y="446" font-size="10.5" text-anchor="start" class="mono">LIPA (lysosomal CE hydrolase)</text><text x="988" y="446" font-size="10.5" text-anchor="end" class="mono" font-weight="600" fill="var(--c-dn)">−0.249 (FDR 0.003)</text><text x="522" y="462" font-size="9" text-anchor="start" class="mono muted">so cholesteryl ester is NOT a universal APOE4 readout</text><text x="0" y="496" font-size="11" text-anchor="start" class="mono muted" font-weight="600">WITHDRAWN IN REVISION — the opposing 24S-OHC arm</text><rect x="0" y="506" width="1000" height="46" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/><text x="12" y="525" font-size="11" text-anchor="start" class="mono" font-weight="600">CYP46A1</text><text x="96" y="525" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">our LC pool +0.180 (FDR 0.037)  ·  isogenic iPSC oligodendroglia −0.707 (q 1.7e-04, OPPOSITE)  ·  post-mortem null (p 0.44)</text><text x="12" y="542" font-size="9.5" text-anchor="start" class="mono muted">Cell-type rescue FAILS — our ERC oligodendrocytes lean +0.310, opposite sign in the same cell type. 24S-OHC is unmeasured in all 5 datasets.</text><rect x="0" y="560" width="1000" height="32" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="14" y="574" font-size="10" text-anchor="start" class="mono" font-weight="600">Still unmeasured:</text><text x="126" y="574" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">desmosterol, lathosterol, 24S-/25-/27-OHC — 0 of 5 APOE datasets. The sterol labels above remain inferred from enzyme transcripts.</text><text x="14" y="587" font-size="10" text-anchor="start" class="mono" font-weight="600">Decisive test, possibly already run:</text><text x="238" y="587" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">TCW's GC-MS protocol (Müller 2019) resolves 23 distal sterol intermediates, desmosterol among them — only FC/TC/CE were reported.</text></svg>