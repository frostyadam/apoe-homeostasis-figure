*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:18.2px/1.55 var(--sans);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:38.7px;line-height:1.15}
h2{font-size:23px;line-height:1.25;display:flex;gap:10px;align-items:baseline}
h2 .tag{font-family:var(--mono);font-weight:500;font-size:14.5px;color:var(--ink2);border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
p{margin:0;max-width:72ch}
.eyebrow{font:500 14.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
header{display:flex;flex-direction:column;gap:12px}
.lede{font-size:20px;color:var(--ink2);max-width:70ch}
.lede b{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.fact{background:var(--surf);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.fact .v{font:500 24.2px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.fact .k{font-size:15.7px;color:var(--ink2)}
section.panel{background:var(--surf);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:15.7px;color:var(--ink2)}
.controls label{display:flex;gap:6px;align-items:center}
select{font:15.7px var(--sans);color:var(--ink);background:var(--surf);border:1px solid var(--rule);border-radius:4px;padding:4px 6px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{font:15.7px var(--sans);color:var(--ink2);background:var(--surf);border:0;border-right:1px solid var(--rule);padding:4px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surf)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.scroll{overflow-x:auto}
.heatscroll{overflow:auto;max-height:620px;border-top:1px solid var(--grid)}
svg{display:block;max-width:100%;height:auto}
svg text{fill:var(--ink);font-family:var(--sans)}
svg .mono{font-family:var(--mono)}
svg .ink2{fill:var(--ink2)}
svg .muted{fill:var(--muted)}
figcaption,.cap{font-size:15.7px;color:var(--ink2);max-width:90ch;line-height:1.5}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:15.2px;color:var(--ink2)}
.ramp{display:inline-block;width:140px;height:10px;border-radius:2px;vertical-align:middle}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.caveats{border:1px solid var(--rule);border-radius:6px;background:var(--surf);padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px;font-size:16.4px;color:var(--ink2)}
.caveats b{color:var(--ink);font-weight:600;display:block;font-size:16.4px}
.refs{font-size:15.7px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.refs a{color:var(--ink2)}
details{font-size:15.7px;color:var(--ink2)}
details summary{cursor:pointer}
table{border-collapse:collapse;font:14.5px var(--mono);font-variant-numeric:tabular-nums;margin-top:8px}
th,td{padding:3px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--ink2);font-weight:500}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--surf);color:var(--ink);border:1px solid var(--rule);border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:8px 10px;font-size:15.2px;line-height:1.45;max-width:320px}
#tip .t{font-weight:600;margin-bottom:2px}
#tip .m{font-family:var(--mono);font-variant-numeric:tabular-nums}
#tip table{margin-top:4px}
#tip td{padding:1px 6px 1px 0;border:0}
.hit{cursor:pointer}
.ghit{cursor:help}
.ghit:focus{outline:2px solid var(--c-gwas);outline-offset:1px}
@media (max-width:560px){h1{font-size:31.5px}.wrap{padding-inline:16px}}
@media (prefers-reduced-motion:no-preference){.node rect{transition:fill .2s}}
</style>

<style>
html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:fixed;inset:0 0 34px 0;display:flex;align-items:stretch;gap:22px;padding:12px 16px}
#fig{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center}
/* Lock the element to the master viewBox aspect so the rendered area EQUALS the
   viewBox. With width/height:100% the element took the window aspect and SVG's
   default xMidYMid meet letterboxed the drawing, putting blank page bands inside
   the frame (~205px each side at 16:9) - which is what stopped zoomed stops from
   reading as a clean rectangle. */
#schem{aspect-ratio:1100 / 766;width:auto;height:auto;max-width:100%;max-height:100%;
  min-width:0 !important;background:var(--page);
  border:1px solid var(--rule);border-radius:3px}
/* The caption is a SIDE PANEL, never an overlay - it must not cover the drawing.
   `side` on each stop puts it left or right of the figure; a consistent side is
   easier to follow in a talk, so all stops use one unless deliberately flipped. */
#card{flex:0 0 clamp(250px,26vw,400px);align-self:center;max-height:100%;overflow:auto;background:var(--surf);
  border:1px solid var(--rule);border-radius:10px;padding:20px 22px 22px;
  transition:opacity .2s}
body[data-side="left"] #stage{flex-direction:row-reverse}
#num{font:600 12px/1 ui-monospace,monospace;letter-spacing:.09em;
  color:var(--muted);text-transform:uppercase}
#ttl{font-weight:640;font-size:23px;line-height:1.22;margin:10px 0 10px;letter-spacing:-.012em}
#sub{font-size:16.5px;line-height:1.55;color:var(--ink2)}
/* Evidence key, shown only on the overview stop. Swatches read their colour from
   the same :root tokens the cartoon's gene labels use, so they cannot drift. */
#leg{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:none}
#leg.on{display:block}
#leg .r{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.42;
  color:var(--ink2);margin-bottom:9px}
#leg .sw{width:14px;height:14px;border-radius:3px;flex:0 0 auto;margin-top:3px}
#leg .gl{flex:0 0 auto;width:36px;height:23px;margin-top:-1px}
#leg .k{font-weight:700;color:var(--ink);flex:0 0 auto;width:14px;text-align:center;
  font-size:15px;margin-top:0}
#leg .note{font-size:14px;line-height:1.42;color:var(--muted)}
#leg .nb{font-size:13.5px;line-height:1.45;color:var(--ink2);margin:0 0 8px;
  padding-left:11px;border-left:2px solid var(--rule)}
#leg .nb b{color:var(--ink);font-weight:640}
#leg .nb sub{font-size:.72em}
/* Narrow windows: stack the panel under the figure rather than squeezing it. */
@media (max-width:820px){
  #stage{flex-direction:column !important;align-items:center}
  #card{flex:0 0 auto;max-width:96%}
}
#bar{position:fixed;left:0;right:0;bottom:0;height:34px;display:flex;
  align-items:center;gap:7px;justify-content:center;background:var(--page);
  border-top:1px solid var(--rule);z-index:6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);cursor:pointer;
  border:0;padding:0;transition:background .2s,transform .2s}
.dot.on{background:var(--ink);transform:scale(1.32)}
/* inside the bottom bar, never over the drawing */
#hint{position:fixed;right:14px;bottom:10px;font:11px/1 ui-monospace,monospace;
  color:var(--muted);z-index:7}
body.clean #bar,body.clean #hint{display:none}
@media print{#bar,#hint{display:none}}
</style>

    //         freed up - y562-577 measures clear from x16 to x260, between 'Nucleus' (ends
    //         y552) and 'desmosterol' (starts y584, x73).
    // The arrow does NOT reuse the agonist's old route: that ended at (57,611), which lands on
    // the blue inhibitory bar (M 55 610 L 69 610) and abuts the LXR ellipse at x63. It is
    // re-aimed down the empty corridor x15-35 / y584-636 to the left end of the LXRE helix
    // (y638-646, x34-172), which is also the better target - reprogramming acts on the
    // transcriptional programme, not on the receptor protein.
    // Grey matches the two arrows into the mTORC1 pill. Block 2's GREY is scoped to its own
    // braces, so it is recomputed here rather than reused; #ahg is the grey arrowhead created
    // earlier in this function (the default #ah head is --ink2 and would read as a mismatch).
    const GREY=mix(css("--ink2"),"#ffffff",0.2), g=el("g",{},ROOT);
    rxTag(g,20,574,["chemical reprogramming"],GREY);
    el("path",{d:"M 30 584 Q 16 608 32 630",stroke:GREY,"stroke-width":1.8,fill:"none",
      "marker-end":"url(#ahg)"},g);
    // The two transcriptional outputs the hypothesis names. Placed at root y706/722: a clearance
    // sweep of the nucleus for a 112x16 run found the band y708-724 to be the only free space
    // (27.3 units clear), below "hypo-agonised / efflux down" and inside the frame's y730 edge.
    // Parented to ROOT like the rest of this block, so these are root coordinates.
    txt(g,34,706,"transcriptional outputs",{"font-size":9,class:"mono",style:`fill:${css("--muted")}`});
    geneRun(g,34,722,["ABCA1","TET2"],10,"start");
    // open-ended: these two are named examples, not the whole LXR/RXR output
    txt(g,138,722,"\u00b7 \u2026",{"font-size":10,class:"mono",style:`fill:${css("--muted")}`});
    protTip(g,"Therapeutic hypothesis 3 - chemical reprogramming",
      "Drawn in the nucleus because this is the one intervention on the figure aimed at cell state rather than at a single protein: small-molecule induction of partial reprogramming, intended to reset the transcriptional programme of APOE4 glia rather than to correct any one step of the pathway drawn here. TWO TRANSCRIPTIONAL OUTPUTS ARE NAMED BELOW THE RESPONSE ELEMENT. ABCA1 is the canonical efflux target of this arm and already appears twice in the cartoon, at the trans-Golgi bud and on the lysosome; it carries an AD GWAS locus, an Open Targets AD association and Mendelian CNS disease, which is why it is plum with two dots. TET2, the DNA demethylase, is drawn because the hypothesis names it, and it carries NO evidence category here at all: not an AD GWAS locus, absent from the locus coeruleus expression universe so it can never take red or blue, and its Mendelian evidence is entirely haematological and immunological with no nervous-system disease. Its ink colour is the honest reading - a named prediction with nothing behind it in these data. Caveat: nothing in this figure tests the intervention itself, and resetting cell state in post-mitotic tissue is not a reversible perturbation, so its off-target risk is the hardest on the figure to bound.");
  }

}
function nodeTip(k){
  const st=STEP[k];
  const nm2={gwas:"AD GWAS",ot:"Open Targets AD",up:"higher in APOE4",dn:"lower in APOE4"};
  // a merged label spells out its members, so collapsing DNM1+DNM2 into "DNM1/2" to save a row
  // does not hide which gene carries which evidence
  const shown=st.nodes.filter(keepG).map(g=>{const c=GC(g);
    const mem=(c.members&&c.members.length)?" ["+c.members.join(" + ")+"]":"";
    return `${g}${mem}${c.cats&&c.cats.length?" ("+c.cats.map(x=>nm2[x]).join(", ")+")":c.why?" ("+c.why+")":""}`});
  return `<div class="t">${st.label}</div><div class="m">${st.go} · ${st.n} genes in the downloaded set</div><div>${shown.length?"labelled: "+shown.join("; "):"no labelled genes (none meet the evidence rule)"}</div>`;
}
</script>

<script>
const STOPS=[
  {t:"APOE homeostasis", s:"The whole cell. Synthesis and secretion on the left, uptake and lysosomal traffic on the right. Gene names appear only where there is disease or APOE-dependent evidence.", box:[0,-36,1100,766], side:"right", glyphs:["apoe", "particle", "chol"]},
  {t:"Lipoparticle biogenesis", s:"APOE is inserted into the ER as it is translated. Alongside it the mevalonate enzymes end at DHCR24, which makes cholesterol from desmosterol. The first particle forms at the Golgi with ABCA1.", box:[102,330,367,256], side:"right", glyphs:["apoe", "particle", "chol"]},
  {t:"Lipoparticle secretion and maturation", s:"The vesicle fuses with the membrane and ABCA1 and ABCA7 lipidate APOE. Outside, particles carry APOC1, APOC2 and CLU/APOJ, and PLTP remodels them.", box:[0,-36,476,145], side:"right", glyphs:["apoe", "particle", "chol"]},
  {t:"Lipoparticle receptors", s:"HSPG captures the particle and hands it to a receptor. Each receptor is filled with its evidence colour. An erythrocyte sits above them \u2014 the one intravascular compartment on this figure.", box:[470,-36,414,288], side:"right", glyphs:["particle"], notes:["The <b>erythrocyte</b> is here because the systemic genetics ties APOE lipoprotein handling to red cells: across ten lead variants in lipid-handling genes associated with <b>red cell distribution width</b>, the allele that raises HDL-C also raises RDW in <b>nine</b> of them \u2014 including <b>SCARB1</b> and <b>CD36</b>, both already on the receptor list in this figure.", "<b>The route, from mouse genetics:</b> in SR-BI-null mice raised HDL-C increases the erythrocyte cholesterol-to-phospholipid ratio, which lowers deformability and raises osmotic fragility, shortening lifespan and provoking a reticulocytosis \u2014 and a reticulocytosis is by construction a wider volume distribution. The red cell defect is markedly worse when <b>APOE is deleted as well as SR-BI</b>.", "<b>Only two receptors are drawn, and that is the point.</b> A mature erythrocyte has no reactivity to lipid-free apolipoprotein; it is the standard negative control for receptor-mediated lipid efflux, so its sterol moves by non-specific exchange (t\u00bd \u2248 3 h), which LCAT then makes net rather than merely balanced.", "<b>Compartment caveat:</b> red cells are intravascular, whereas the rest of this cartoon is a brain cell. Brain APOE particles are astrocyte-derived and largely a separate pool from plasma \u2014 though lipid species do exchange at the CSF\u2013blood barrier, with APOE genotype affecting that exchange in entorhinal cortex.", "SR-BI and CD36 are coloured by <i>this</i> figure's code (APOE4-vs-APOE2 and Alzheimer genetics), not by their RDW direction.", "The series above ranks the isoforms by LDLR affinity. <b>APOE3</b> is the reference (Cys112, Arg158).", "<b>APOE2</b> is <b>R158C</b> (Arg158\u2192Cys). <b>APOE4</b> is <b>C112R</b> (Cys112\u2192Arg).", "<b>E3-Cc</b> is <b>APOE3-Christchurch</b>, <b>R136S</b> (Arg136\u2192Ser), on an APOE3 backbone \u2014 a protective variant.", "Residue numbers are for the mature protein; add 18 for precursor numbering."]},
  {t:"Receptor-mediated endocytosis", s:"PICALM and BIN1 drive internalisation. The neck undergoes scission, then the coat uncoats. Cargo legend at top right.", box:[626.4,-10.4,473.66,329.91], side:"right", glyphs:["particle", "abeta"], notes:["<b>Therapeutic hypothesis 1</b> \u2014 an <b>anti-APOE4 mAb</b>, drawn ENGAGED rather than approaching: both paratopes on the particle surface, the Fc trailing, and the route to the clathrin pit dashed and barred. The intent is steric \u2014 occupy the APOE surface that HSPG and the LDLR family read, so the particle is never internalised.", "It is a <b>hypothesis, not a result</b>: nothing in our data speaks to it, it must cross the blood-brain barrier or be given intrathecally, and isoform selectivity is unsolved \u2014 APOE3 and APOE4 differ by C112R, which is not surface-exposed on the lipidated particle.", "<b>E3-Cc</b> is <b>APOE3-Christchurch</b>, <b>R136S</b> (Arg136\u2192Ser), on an APOE3 backbone. APOE2 is R158C, APOE4 is C112R.", "<b>LDLR K<sub>d</sub></b> on lipidated nanodiscs by SPR: E2 <b>800 nM</b> \u00b7 E3 <b>16 nM</b> \u00b7 E4 <b>9 nM</b>.", "E3-Cc has <b>no published K<sub>d</sub></b>; it binds at <b>41%</b> of E3 in a fibroblast assay.", "The E4 step is ~<b>1.8-fold</b> by SPR, but runs with our finding that <b>APOE4 lipoparticles accumulate intracellularly</b> more than APOE3 \u2014 plausibly extra receptor engagement or slower recycling."]},
  {t:"Early endosome", s:"Mildly acidic, and still holding APOE. A vesicle buds off to recycle receptors; the rest matures onward.", box:[680.4,169,419.6,292.2], side:"right", glyphs:["apoe", "particle"]},
  {t:"Lipid and sterol catabolism, mTORC1 activation", s:"LIPA frees cholesterol from cholesteryl ester, and NPC2 with NPC1 export it at ER contact sites. TM6SF1 and SLC38A9 sense it and recruit mTORC1. Cholesterol and BMP rise here in APOE4. At left, a lysosome carrying undigested amyloid-\u03b2 and tau heads for exocytosis.", box:[505,315.7,595,414.3], side:"right", glyphs:["chol", "bmp", "whorl", "particle", "abeta", "tau"], notes:["<b>Therapeutic hypothesis 2</b> \u2014 the <b>rapalog</b> at right inhibits mTORC1 where cholesterol activates it on the lysosome. APOE4 glia hold 3\u00d7 more lysosomal cholesterol, and TM6SF1 engages Ragulator cholesterol-dependently. But every gene in this module is transcriptionally <b>flat</b>, so the inhibitory bar is drawn on the pathway, not on our measurements.", "<b>LIPA carries a \u2020</b> because its blue comes from one ancestry stratum and reverses in the other: African-ancestry \u22120.61, European-ancestry <b>+0.16</b>, pooled \u22120.25 (between-stratum q 8.7e\u22128). \u201cLower in APOE4\u201d is not supportable for LIPA as a general claim.", "The lysosomal cholesterol machinery drawn here \u2014 NPC1, NPC2, TM6SF1, Ragulator, the Rag GTPases, mTORC1 \u2014 is transcriptionally <b>flat</b>: a lipid phenotype without a transcriptional signature."]},
  {t:"Transcriptional consequences and targets", s:"Less desmosterol leaves LXR/RXR on the LXR response element under-agonised, so the efflux programme falls.", box:[0,429,380.5,265], side:"right", glyphs:["chol"], notes:["<b>Therapeutic hypothesis 3</b> \u2014 <b>chemical reprogramming</b>, marked in the nucleus, is the only intervention on this figure aimed at cell state rather than at a single protein. Nothing in our data tests it: the label marks where such an intervention would act, not a result.", "<b>LXR agonism is pharmacologically responsive in APOE4 glia</b>, even though no agonist is drawn: GW3965 and T0901317 restore APOE4 cholesterol efflux to untreated-APOE3 levels. The rescue is incomplete, and systemic LXR agonism drives hepatic lipogenesis.", "<b>Direct LXR/RXR targets down in human spatial transcriptomics data:</b> PLTP <b>\u22120.51</b>, the APOE/APOC1/APOC2 cluster (\u22120.18, \u22120.75, \u22120.41), CD36 <b>\u22120.92</b>.", "ABCA1 and ABCA7 are <b>flat in the spatial transcript data</b> (FDR 0.13 and 0.70) but are decreased in isogenic APOE4 astrocytes."]},
  {t:"The whole route", s:"Synthesis to secretion to uptake to the lysosome, cholesterol back to the ER, and the response in the nucleus.", box:[0,-36,1100,766], side:"right", glyphs:["apoe", "particle", "chol"]}
];
const VB=[0.0,-36.0,1100.0,766.0];                       // master viewBox
const AR=VB[2]/VB[3];                    // master aspect ratio
const svg=document.getElementById("schem");
/* Colour rows are derived at runtime from the gene labels actually inside the
   current frame, so a stop's key can never disagree with what is on screen. */
const CAT_TEXT={gwas:["--c-gwas","AD GWAS locus (consensus Tier 1/2)"],
                ot:  ["--c-ot",  "Open Targets AD genetic association"],
                up:  ["--c-up",  "higher expression in APOE4 carriers"],
                dn:  ["--c-dn",  "lower expression in APOE4 carriers"],
                mendel:["--c-mendel","Mendelian CNS disease (severe monogenic neurological disease)"]};
const CAT_SEQ=["gwas","ot","up","dn","mendel"];
const LEGEND_MARKS={cis:["‡","within 1 Mb of APOE, so the difference can follow the haplotype"],
                    het:["†","pooled colour comes from one ancestry stratum and reverses in the other"],
                    adlit:["§","link to Alzheimer's in the primary literature, absent from Open Targets"],
                    dot:["●","one further category the gene also belongs to"]};
/* Glyph rows reuse the cartoon's own drawing functions, so the swatch is literally
   the same mark as the one in the figure. */
const GLYPHS={
  apoe:     ["APOE protein, a four-helix bundle", g=>apoeBundle(g,18,11.5,0,2.0)],
  chol:     ["cholesterol", g=>el("circle",{cx:18,cy:11.5,r:5.6,fill:css("--chol")},g)],
  particle: ["APOE lipoparticle, cholesterol inside", g=>particle(g,18,11.5,10.5)],
  abeta:    ["amyloid-β aggregate", g=>fibAbeta(g,4,11.5,28)],
  tau:      ["tau aggregate", g=>fibTau(g,4,11.5,28)],
  bmp:      ["BMP, a lysosomal lipid that accumulates with age, in storage disorders and in drug-induced phospholipidosis", g=>bmpGlyph(g,18,11.5,0,1.5)],
  whorl:    ["whorl of undigested membrane", g=>whorl(g,18,11.5,9.5,2.2)]
};
function geneTokens(txt){            // split on any non-alphanumeric run: handles
  return txt.split(/[^A-Za-z0-9]+/)  // middots, slashes, spaces and the marks at once
            .filter(Boolean).map(t=>t.toUpperCase());
}
function rootBox(t){
  const b=t.getBBox(), m=svg.getScreenCTM().inverse().multiply(t.getScreenCTM());
  const P=[[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]]
    .map(([x,y])=>[m.a*x+m.c*y+m.e, m.b*x+m.d*y+m.f]);
  const xs=P.map(q=>q[0]), ys=P.map(q=>q[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}
function catsInView(box){
  const [X,Y,W,H]=box;
  const cats=new Set(); let cis=false, multi=false;
  svg.querySelectorAll("text").forEach(t=>{
    const s=(t.textContent||"").trim(); if(!s) return;
    const [x0,y0,x1,y1]=rootBox(t);
    if(!(x0>=X-0.5 && x1<=X+W+0.5 && y0>=Y-0.5 && y1<=Y+H+0.5)) return;
    if(s.indexOf("‡")>=0) cis=true;
    geneTokens(s).forEach(gname=>{
      const rec=(D.genecat||{})[gname]; if(!rec) return;
      const c=rec.cats||[];
      if(c.length>1) multi=true;
      c.forEach(k=>cats.add(k));
    });
  });
  return {cats:CAT_SEQ.filter(k=>cats.has(k)), cis, multi};
}
const card=document.getElementById("card"),legE=document.getElementById("leg"),numE=document.getElementById("num"),
      ttlE=document.getElementById("ttl"),subE=document.getElementById("sub"),
      barE=document.getElementById("bar");
let i=0, anim=null;

/* Expand a loose box to the master aspect ratio so framing is predictable and
   SVG's preserveAspectRatio never letterboxes in a way we did not intend. */
function fit(b){
  let [x,y,w,h]=b;
  if(w/h > AR){ const nh=w/AR; y-=(nh-h)/2; h=nh; }
  else        { const nw=h*AR; x-=(nw-w)/2; w=nw; }
  /* Clamp inside the master viewBox so a frame never shows blank canvas past the
     drawing's edge - that is what made zoomed stops read as ragged rather than as a
     clean rectangle. The canvas is exactly AR, so w<=VB[2] implies h<=VB[3]. */
  if(w>=VB[2]) return VB.slice();
  x=Math.min(Math.max(x,VB[0]),VB[0]+VB[2]-w);
  y=Math.min(Math.max(y,VB[1]),VB[1]+VB[3]-h);
  return [x,y,w,h];
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const setVB=b=>svg.setAttribute("viewBox",b.map(v=>v.toFixed(2)).join(" "));

function go(n,instant){
  n=Math.max(0,Math.min(STOPS.length-1,n));
  const from=(svg.getAttribute("viewBox")||VB.join(" ")).split(/\s+/).map(Number);
  const to=fit(STOPS[n].box);
  i=n; paint();
  if(anim) cancelAnimationFrame(anim);
  if(instant||from.some(isNaN)){ setVB(to); return; }
  const dur=900, t0=performance.now();
  (function step(now){
    const k=ease(Math.min(1,(now-t0)/dur));
    setVB(from.map((v,j)=>v+(to[j]-v)*k));
    if(k<1) anim=requestAnimationFrame(step);
  })(t0);
}
function paint(){
  const s=STOPS[i];
  document.body.dataset.side = s.side || "right";
  buildLegend(s);
  numE.textContent=`${i+1} / ${STOPS.length}`;
  ttlE.textContent=s.t; subE.textContent=s.s;
  [...barE.children].forEach((d,j)=>d.classList.toggle("on",j===i));
}
function buildLegend(s){
  const glyphs=s.glyphs||[];
  const {cats,cis,multi}=catsInView(fit(s.box));
  const show=(cats.length||glyphs.length);
  legE.classList.toggle("on", !!show);
  if(!show){ legE.innerHTML=""; return; }
  legE.innerHTML="";
  cats.forEach(k=>{
    const [v,txt]=CAT_TEXT[k];
    const r=document.createElement("div"); r.className="r";
    const sw=document.createElement("span"); sw.className="sw";
    sw.style.background="var("+v+")";
    const lb=document.createElement("span"); lb.textContent=txt;
    r.append(sw,lb); legE.appendChild(r);
  });
  glyphs.forEach(key=>{
    const entry=GLYPHS[key]; if(!entry) return;
    const [txt,draw]=entry;
    const r=document.createElement("div"); r.className="r";
    const sv=document.createElementNS(NS,"svg");
    sv.setAttribute("viewBox","0 0 36 23"); sv.setAttribute("class","gl");
    const g=el("g",{},sv); draw(g);
    const lb=document.createElement("span"); lb.textContent=txt;
    r.append(sv,lb); legE.appendChild(r);
  });
  (s.notes||[]).forEach(html=>{
    const d=document.createElement("div"); d.className="nb"; d.innerHTML=html;
    legE.appendChild(d);
  });
  [multi?"dot":null, cis?"cis":null].filter(Boolean).forEach(k=>{
    const [sym,txt]=LEGEND_MARKS[k];
    const r=document.createElement("div"); r.className="r";
    const kk=document.createElement("span"); kk.className="k"; kk.textContent=sym;
    const lb=document.createElement("span"); lb.className="note"; lb.textContent=txt;
    r.append(kk,lb); legE.appendChild(r);
  });
}
barE.innerHTML=STOPS.map((s,j)=>
  `<button class="dot" data-i="${j}" title="${s.t.replace(/"/g,"&quot;")}" aria-label="${s.t.replace(/"/g,"&quot;")}"></button>`).join("");
barE.addEventListener("click",e=>{const d=e.target.closest(".dot"); if(d) go(+d.dataset.i)});

addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","Enter","n"].includes(e.key)){go(i+1);e.preventDefault()}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace","p"].includes(e.key)){go(i-1);e.preventDefault()}
  else if(e.key==="Home"||e.key==="0"){go(0)}
  else if(e.key==="End"){go(STOPS.length-1)}
  else if(e.key==="c"){document.body.classList.toggle("clean")}
  else if(e.key==="t"){const r=document.documentElement;
    r.dataset.theme = r.dataset.theme==="dark" ? "light" : "dark"; drawA(); go(i,true)}
  else if(e.key==="f"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
addEventListener("click",e=>{ if(!e.target.closest("#bar,#card")) go(i+1) });

drawA();
go(0,true);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{drawA();go(i,true)});
</script>
