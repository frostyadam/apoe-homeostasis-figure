<svg id="sterolnr" viewBox="0 0 1000 500" style="min-width:760px" role="img" aria-label="Sterol-enzyme evidence restructured. Top: DHCR24 is higher in APOE4 in five independent datasets across three platforms and two species, including isogenic human iPSC oligodendroglia. Middle: DHCR24 consumes desmosterol, an endogenous LXR agonist, so the replicated rise predicts less desmosterol and weaker LXR/RXR agonism; the DHCR24-desmosterol-LXR-alpha axis is genetically proven in liver. Right: the predicted consequence is less cholesterol efflux and more storage, which matches 35 of 35 cholesteryl-ester species raised about nine-fold in APOE4 oligodendroglia, BMP raised in three cohorts, and LIPA lower. Bottom: the opposing 24S-hydroxycholesterol arm is withdrawn because CYP46A1 is down in isogenic human oligodendroglia and null post-mortem. No sterol or oxysterol is measured in any of these datasets."><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--ink2)"/></marker></defs><text x="0" y="14" font-size="11" text-anchor="start" class="mono muted" font-weight="600">THE REPLICATED OBSERVATION — DHCR24 higher in APOE4, five datasets, three platforms, two species</text><rect x="0" y="24" width="1000" height="146" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><text x="12" y="42" font-size="9.5" text-anchor="start" class="mono muted">dataset</text><text x="470" y="42" font-size="9.5" text-anchor="end" class="mono muted">log₂FC</text><text x="486" y="42" font-size="9.5" text-anchor="start" class="mono muted">significance</text><text x="660" y="42" font-size="9.5" text-anchor="start" class="mono muted">what it controls for</text><text x="12" y="64" font-size="10.5" text-anchor="start" class="mono">our LC Visium · 5-domain pool</text><rect x="300" y="55" width="57.96000000000001" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="64" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.276</text><text x="486" y="64" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">FDR 5.7×10⁻⁷</text><text x="660" y="64" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">spot-level, E4 vs E2 carriers</text><text x="12" y="83" font-size="10.5" text-anchor="start" class="mono" fill="var(--ink2)">our ERC snRNA · oligodendrocytes</text><rect x="300" y="74" width="42.21" height="10" rx="1.5" fill="var(--c-up)"/><rect x="300" y="74" width="42.2" height="10" rx="1.5" fill="var(--surf)" opacity="0.45"/><text x="470" y="83" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.201</text><text x="486" y="83" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">n.s. (underpowered)</text><text x="660" y="83" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">cell-type resolved, same direction</text><text x="12" y="102" font-size="10.5" text-anchor="start" class="mono">isogenic iPSC oligodendroglia</text><rect x="300" y="93" width="128.94" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="102" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.614</text><text x="486" y="102" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">q 1.7×10⁻⁴</text><text x="660" y="102" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">genotype is the ONLY variable</text><text x="12" y="121" font-size="10.5" text-anchor="start" class="mono">post-mortem oligodendrocytes · Nebula</text><rect x="300" y="112" width="115.71000000000001" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="121" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.551</text><text x="486" y="121" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">padj 0.024</text><text x="660" y="121" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">human tissue, per-nucleus</text><text x="12" y="140" font-size="10.5" text-anchor="start" class="mono">post-mortem oligodendrocytes · Wilcoxon</text><rect x="300" y="131" width="24.779999999999998" height="10" rx="1.5" fill="var(--c-up)"/><text x="470" y="140" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.118</text><text x="486" y="140" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">top-ranked, up in AD + non-AD</text><text x="660" y="140" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">~10⁵ nuclei, both strata</text><text x="12" y="164" font-size="9.5" text-anchor="start" class="mono muted">DHCR24 = 24-dehydrocholesterol reductase: converts desmosterol → cholesterol. Also seladin-1, reduced in vulnerable neurons in AD.</text><text x="0" y="192" font-size="11" text-anchor="start" class="mono muted" font-weight="600">THE PREDICTION IT LICENSES — less agonist reaching LXR/RXR</text><rect x="0" y="202" width="596" height="124" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><circle cx="40" cy="242" r="9" fill="var(--chol)"/><text x="40" y="268" font-size="10" text-anchor="middle" class="mono" font-weight="600">desmosterol</text><text x="40" y="280" font-size="8.5" text-anchor="middle" class="mono muted">LXR agonist</text><path d="M 64 242 L 112 242" stroke="var(--ink2)" stroke-width="1.8" fill="none" marker-end="url(#ah3)"/><text x="88" y="234" font-size="9" text-anchor="middle" class="mono" fill="var(--ink2)">consumed</text><text x="88" y="256" font-size="9" text-anchor="middle" class="mono" fill="var(--ink2)">faster</text><circle cx="140" cy="242" r="9" fill="none" stroke="var(--c-dn)" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><circle cx="140" cy="242" r="3.4" fill="var(--chol)" opacity="0.3"/><text x="140" y="268" font-size="10" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">desmosterol ↓</text><text x="140" y="280" font-size="8.5" text-anchor="middle" class="mono muted">predicted</text><path d="M 164 242 L 226 242" stroke="var(--c-dn)" stroke-width="2.2" fill="none"/><path d="M 226 232 L 226 252" stroke="var(--c-dn)" stroke-width="3"/><text x="195" y="230" font-size="9.5" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">LESS agonism</text><rect x="240" y="212" width="156" height="92" rx="6" fill="var(--neutral)" stroke="var(--ink)" stroke-width="1.6"/><text x="318" y="242" font-size="15" text-anchor="middle" font-weight="600">LXR / RXR</text><text x="318" y="260" font-size="9.5" text-anchor="middle" class="mono" fill="var(--ink2)">NR1H2 / NR1H3</text><text x="318" y="280" font-size="9" text-anchor="middle" class="mono" fill="var(--ink2)">hypothesised:</text><text x="318" y="293" font-size="10" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">HYPO-agonised</text><path d="M 400 242 L 438 242" stroke="var(--ink2)" stroke-width="1.8" fill="none" marker-end="url(#ah3)"/><text x="446" y="234" font-size="11" text-anchor="start" class="mono" font-weight="600" fill="var(--c-dn)">efflux ↓</text><text x="446" y="250" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">PLTP −0.505</text><text x="446" y="264" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">isogenic glia, IPA:</text><text x="446" y="277" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">efflux z −2.38</text><text x="446" y="290" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">accum. z +2.77</text><text x="12" y="340" font-size="9.5" text-anchor="start" class="mono muted">Axis proven causally, in liver: DHCR24 inhibition raises desmosterol; every effect abolished in LXRα-null mice (EMBO Mol Med 2023).</text><text x="12" y="353" font-size="9.5" text-anchor="start" class="mono muted">ABCA1 n.s. (−0.221, FDR 0.13); ABCG1, ABCG4, MYLIP not measured; APOE/APOC1/APOC2 down but cis ‡.</text><text x="612" y="192" font-size="11" text-anchor="start" class="mono muted" font-weight="600">WHAT IS ACTUALLY MEASURED DOWNSTREAM — storage</text><rect x="612" y="202" width="388" height="124" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="624" y="224" font-size="11.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-up)">cholesteryl ester</text><text x="988" y="224" font-size="11.5" text-anchor="end" class="mono" font-weight="600" fill="var(--c-up)">35 / 35 species ↑</text><text x="624" y="239" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">isogenic APOE4/4 oligodendroglia, no tau · +3.17 log₂ (≈9×)</text><text x="624" y="264" font-size="11.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-up)">BMP (lysosomal)</text><text x="988" y="264" font-size="11.5" text-anchor="end" class="mono" font-weight="600" fill="var(--c-up)">↑ in 3 cohorts</text><text x="624" y="279" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">APOE4 EC dose p=0.007 · APOE4 forebrain · mTORC1 cortex</text><text x="624" y="304" font-size="11.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-dn)">LIPA</text><text x="988" y="304" font-size="11.5" text-anchor="end" class="mono" font-weight="600" fill="var(--c-dn)">−0.249 (FDR 0.003)</text><text x="624" y="319" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">lysosomal CE hydrolase — the direction that PERMITS storage</text><path d="M 556 300 L 606 280" stroke="var(--ink2)" stroke-width="1.8" fill="none" marker-end="url(#ah3)"/><text x="0" y="372" font-size="11" text-anchor="start" class="mono muted" font-weight="600">WITHDRAWN IN THIS REVISION — the opposing 24S-OHC arm</text><rect x="0" y="382" width="1000" height="78" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/><text x="12" y="402" font-size="11.5" text-anchor="start" class="mono" font-weight="600">CYP46A1</text><text x="12" y="418" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">read as: up → more 24S-OHC</text><text x="12" y="431" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">→ MORE agonism</text><text x="250" y="402" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">our LC pool</text><text x="468" y="402" font-size="10.5" text-anchor="end" class="mono" font-weight="500" fill="var(--c-up)">+0.180</text><text x="478" y="402" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">FDR 0.037</text><text x="250" y="419" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">isogenic iPSC oligodendroglia</text><text x="468" y="419" font-size="10.5" text-anchor="end" class="mono" font-weight="600" fill="var(--c-dn)">−0.707</text><text x="478" y="419" font-size="9.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-dn)">q 1.7e-04 — OPPOSITE</text><text x="250" y="436" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">post-mortem oligodendrocytes</text><text x="468" y="436" font-size="10.5" text-anchor="end" class="mono" fill="var(--ink2)">+0.095</text><text x="478" y="436" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">p 0.44 — null</text><text x="660" y="402" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">Cell-type rescue FAILS: our ERC oligodendrocytes</text><text x="660" y="415" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">lean +0.310 — opposite sign, same cell type.</text><text x="660" y="428" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">24S-OHC is unmeasured in all 5 datasets, so Arm B is</text><text x="660" y="441" font-size="9.5" text-anchor="start" class="mono" fill="var(--ink2)">not drawn as a counterweight.</text><rect x="0" y="468" width="1000" height="30" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="14" y="480" font-size="10" text-anchor="start" class="mono" font-weight="600">Not measured:</text><text x="104" y="480" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">desmosterol, lathosterol, 24S-/25-/27-OHC, free cholesterol — 0 of 5 datasets. Every sterol label is inferred from enzyme transcripts.</text><text x="14" y="493" font-size="10" text-anchor="start" class="mono" font-weight="600">Decisive test:</text><text x="104" y="493" font-size="10" text-anchor="start" class="mono" fill="var(--ink2)">desmosterol : cholesterol ratio by sterol LC-MS in isogenic APOE4 vs APOE3 oligodendroglia, with an LXR reporter and CE.</text></svg>