<svg id="sterolnr" viewBox="0 0 1000 372" style="min-width:760px" role="img" aria-label="Predicted metabolite consequences of the raised sterol-synthesis enzymes. DHCR24 consumes desmosterol, an endogenous LXR agonist, so raised DHCR24 predicts less LXR agonism; CYP46A1 up and CYP7B1 down predict more 24-hydroxycholesterol and so more agonism. The two arms oppose. The measured LXR target genes PLTP, ABCA1 and APOE are all lower in APOE4 carriers, which favours the desmosterol arm."><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--ink2)"/></marker></defs><text x="0" y="16" font-size="11.5" text-anchor="start" class="mono muted" font-weight="600">PREDICTED METABOLITE CONSEQUENCE — the enzymes are measured, the sterols are NOT</text><rect x="0" y="34" width="300" height="104" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><text x="12" y="54" font-size="11.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-dn)">Arm A · desmosterol</text><circle cx="26" cy="80" r="7" fill="var(--chol)"/><text x="40" y="84" font-size="13" text-anchor="start" font-weight="600">desmosterol</text><text x="40" y="101" font-size="11.5" text-anchor="start" class="ink2">an endogenous LXR agonist</text><text x="12" y="126" font-size="11.5" text-anchor="start" class="mono" fill="var(--c-up)">DHCR24  +0.276   FDR 5.7e-07</text><path d="M 150 78 L 196 78" stroke="var(--ink2)" stroke-width="1.6" fill="none" marker-end="url(#ah2)"/><text x="206" y="74" font-size="11.5" text-anchor="start" class="ink2">consumed</text><text x="206" y="90" font-size="11.5" text-anchor="start" class="ink2">faster</text><text x="318" y="70" font-size="13" text-anchor="start" font-weight="600" fill="var(--c-dn)">desmosterol</text><text x="318" y="88" font-size="12" text-anchor="start" class="mono" fill="var(--c-dn)">↓ predicted</text><text x="318" y="106" font-size="10.5" text-anchor="start" class="ink2">DHCR7 flat (−0.02, FDR 0.89),</text><text x="318" y="120" font-size="10.5" text-anchor="start" class="ink2">so the Bloch branch specifically</text><path d="M 452 78 L 536 78" stroke="var(--c-dn)" stroke-width="2.2" fill="none"/><path d="M 536 67 L 536 89" stroke="var(--c-dn)" stroke-width="3"/><text x="494" y="62" font-size="11" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-dn)">LESS agonism</text><rect x="556" y="52" width="150" height="120" rx="6" fill="var(--neutral)" stroke="var(--ink)" stroke-width="1.6"/><text x="631" y="84" font-size="16" text-anchor="middle" font-weight="600">LXR / RXR</text><text x="631" y="104" font-size="10.5" text-anchor="middle" class="mono ink2">NR1H2/NR1H3</text><text x="631" y="124" font-size="11" text-anchor="middle" class="ink2">nuclear receptor</text><text x="631" y="140" font-size="11" text-anchor="middle" class="ink2">heterodimer</text><text x="631" y="162" font-size="10.5" text-anchor="middle" class="mono" fill="var(--muted)">net tone: unresolved</text><rect x="0" y="190" width="300" height="104" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><text x="12" y="210" font-size="11.5" text-anchor="start" class="mono" font-weight="600" fill="var(--c-up)">Arm B · 24S-hydroxycholesterol</text><text x="12" y="238" font-size="11.5" text-anchor="start" class="mono" fill="var(--c-up)">CYP46A1  +0.180   FDR 0.037</text><text x="12" y="258" font-size="11.5" text-anchor="start" class="mono" fill="var(--c-dn)">CYP7B1   −0.288   FDR 0.0042</text><text x="12" y="280" font-size="11" text-anchor="start" class="ink2">more made, less catabolised</text><text x="318" y="226" font-size="13" text-anchor="start" font-weight="600" fill="var(--c-up)">24S-OHC</text><text x="318" y="244" font-size="12" text-anchor="start" class="mono" fill="var(--c-up)">↑ predicted</text><text x="318" y="262" font-size="10.5" text-anchor="start" class="ink2">a potent LXR agonist</text><path d="M 452 232 L 536 180" stroke="var(--c-up)" stroke-width="2.2" fill="none" marker-end="url(#ah2)"/><text x="500" y="258" font-size="11" text-anchor="middle" class="mono" font-weight="600" fill="var(--c-up)">MORE agonism</text><rect x="740" y="52" width="260" height="168" rx="4" fill="var(--surf)" stroke="var(--rule)" stroke-width="1"/><text x="752" y="72" font-size="11" text-anchor="start" class="mono muted" font-weight="600">MEASURED LXR targets, LC pool</text><path d="M 710 112 L 736 112" stroke="var(--ink2)" stroke-width="1.6" fill="none" marker-end="url(#ah2)"/><text x="752" y="110" font-size="12.5" text-anchor="start" class="mono" font-weight="600">PLTP</text><text x="872" y="110" font-size="12.5" text-anchor="end" class="mono" fill="var(--c-dn)">−0.505</text><text x="988" y="110" font-size="11" text-anchor="end" class="mono ink2">9.7e-05</text><text x="752" y="136" font-size="12.5" text-anchor="start" class="mono">ABCA1</text><text x="872" y="136" font-size="12.5" text-anchor="end" class="mono" fill="var(--c-dn)">−0.221</text><text x="988" y="136" font-size="11" text-anchor="end" class="mono ink2">0.13</text><text x="752" y="162" font-size="12.5" text-anchor="start" class="mono" font-weight="600">APOE ‡</text><text x="872" y="162" font-size="12.5" text-anchor="end" class="mono" fill="var(--c-dn)">−0.181</text><text x="988" y="162" font-size="11" text-anchor="end" class="mono ink2">0.0039</text><text x="752" y="186" font-size="10.5" text-anchor="start" class="ink2">ABCG1, ABCG4, MYLIP — not measured</text><text x="752" y="204" font-size="11" text-anchor="start" class="mono" font-weight="600" fill="var(--c-dn)">all measured targets are DOWN</text><rect x="0" y="304" width="1000" height="62" rx="4" fill="var(--band)" stroke="var(--rule)" stroke-width="1"/><text x="14" y="322" font-size="11.5" text-anchor="start" class="mono" font-weight="600">Reading:</text><text x="74" y="322" font-size="12" text-anchor="start" class="ink2">the two arms oppose, so transcripts cannot give a net direction — but every measured LXR target is lower in APOE4, which favours Arm A.</text><text x="14" y="340" font-size="11.5" text-anchor="start" class="mono" font-weight="600">Decisive test:</text><text x="102" y="340" font-size="12" text-anchor="start" class="ink2">sterol LC-MS for the desmosterol:cholesterol ratio and 24S-OHC.</text><text x="102" y="358" font-size="12" text-anchor="start" class="ink2">The two species are predicted to move in OPPOSITE directions, so the ratio discriminates between the arms.</text></svg>